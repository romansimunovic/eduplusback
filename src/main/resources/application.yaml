# EDUPLUS API - CONFIGURATION TEMPLATE
# Instructions: Copy this file to application.yml and replace placeholders.

spring:
  application:
    name: eduplus-api
  
  datasource:
    # Docker default: jdbc:postgresql://db:5432/eduplus
    # Local default:  jdbc:postgresql://localhost:5432/eduplus
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/your_db_name}
    username: ${DATABASE_USERNAME:your_username}
    password: ${DATABASE_PASSWORD:your_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update # Use 'validate' or 'none' for production
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# Swagger / OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Security Configuration
application:
  security:
    jwt:
      # Generate a 256-bit secret key for production
      secret-key: ${JWT_SECRET_KEY:replace_with_a_secure_long_random_hex_string}
      # 86400000 ms = 24 hours
      expiration: 86400000
